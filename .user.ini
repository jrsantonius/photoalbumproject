; Batas upload aplikasi mengklaim mendukung 15 foto x 10MB.
; Nilai default PHP (2M/8M) terlalu kecil dan menyebabkan
; "Content-Length exceeds limit" sebelum skrip kita sempat berjalan.
upload_max_filesize = 12M
post_max_size = 130M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60
